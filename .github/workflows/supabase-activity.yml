name: Supabase read-only activity check

on:
  workflow_dispatch:
  schedule:
    # Three small database reads daily. Does not guarantee exemption from pausing.
    # Times are UTC; non-zero minute avoids GitHub's top-of-hour rush.
    - cron: "17 7,15,23 * * *"

permissions:
  contents: read

concurrency:
  group: supabase-readonly-activity
  cancel-in-progress: false

jobs:
  read-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run a transaction-level read-only query
        env:
          SUPABASE_ACTIVITY_DATABASE_URL: ${{ secrets.SUPABASE_ACTIVITY_DATABASE_URL }}
          DATABASE_SSL_CA_FILE: .certs/supabase-ca.crt
        run: node --import tsx scripts/supabase-activity-check.ts
